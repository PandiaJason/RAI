[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai"
version = "0.1.0"
description = "Relational Artificial Intelligence - Research Prototype"
authors = [
    {name = "AI Researcher"}
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
